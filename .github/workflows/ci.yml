name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + format + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: No magic hex in module CSS
        run: |
          if grep -rEn '#[0-9a-fA-F]{3,8}\b' src --include='*.module.css'; then
            echo "::error::Magic hex literals found in *.module.css — reference design tokens from globals.css instead"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage)
        run: npm run test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_number }}
          path: coverage/
          retention-days: 7
